services:
  mcp-server:
    build: { context: ., dockerfile: mcp-server/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment: { MCP_PORT: "8788" }
    ports: ["8788:8788"]

  agent-service:
    build: { context: ., dockerfile: agent-service/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment: { AGENT_PORT: "8787" }
    ports: ["8787:8787"]
    depends_on: [mcp-server]

  # Public HTTPS URL for ArmorIQ. Needs NGROK_AUTHTOKEN and NGROK_DOMAIN in .env.
  ngrok:
    image: ngrok/ngrok:3
    command: ["http", "--url=${NGROK_DOMAIN}", "mcp-server:8788"]
    environment: { NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}" }
    depends_on: [mcp-server]
